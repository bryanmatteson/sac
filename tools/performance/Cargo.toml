[package]
name = "sac-performance"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sac = { path = "../..", default-features = false, features = ["native"] }
serde_json = "1"
cpu-time = "1"
tempfile = "3"
allocation-counter = { version = "0.8.1", optional = true }

[features]
optimized-api = []
allocations = ["dep:allocation-counter"]
