[package]
name = "sac-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Content-addressed registry for sealed SAC1 artifacts"
repository = "https://github.com/bryanmatteson/sac"

[dependencies]
sac = { path = "..", version = "0.2", default-features = false, features = ["native"] }
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }

[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
sac = { path = "..", default-features = false, features = ["native", "http"] }
